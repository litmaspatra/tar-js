name: Build TAR-JS Rclone Architecture Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-tarjs-eof-fix-v2.yml'
      - 'ci/apply_tarjs_eof_fix.py'
      - 'ci/apply_kotlin23_compat.py'
      - 'ci/rclone_architecture_harness.go'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct authoritative TAR-JS source
        shell: bash
        run: |
          set -euo pipefail
          cat ci/tarjs_authoritative_20260927_00.b64 ci/tarjs_authoritative_20260927_01.b64 ci/tarjs_authoritative_20260927_02.b64 ci/tarjs_authoritative_20260927_03.b64 ci/tarjs_authoritative_20260927_04.b64 ci/tarjs_authoritative_20260927_05.b64 > /tmp/tarjs.zip.b64
          test "$(wc -c < /tmp/tarjs.zip.b64)" -eq 33303364
          base64 --decode /tmp/tarjs.zip.b64 > /tmp/TAR-JS-source-gomobile-fixed.zip
          echo 'ee9bf544762357f7e152e0c25a4539627b6967d336c1a40f2d322724632f2dca  /tmp/TAR-JS-source-gomobile-fixed.zip' | sha256sum -c -
          unzip -tq /tmp/TAR-JS-source-gomobile-fixed.zip
          mkdir source
          unzip -q /tmp/TAR-JS-source-gomobile-fixed.zip -d source
          chmod -R u+rwX source
          cd source
          sha256sum -c "$GITHUB_WORKSPACE/ci/tarjs_authoritative_20260927.sha256"

      - name: Apply runtime and build fixes
        run: |
          python3 ci/apply_tarjs_eof_fix.py
          python3 ci/apply_kotlin23_compat.py

      - name: Validate patched source and Telegram dummy fixture
        shell: bash
        working-directory: source/TAR-JS
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('fixtures/result.json').read_text(encoding='utf-8'))
          chats = d.get('chats', {}).get('list', [])
          assert chats, 'fixture has no chats'
          messages = chats[0].get('messages', [])
          assert messages, 'fixture has no messages'
          assert any(m.get('reply_to_message_id') for m in messages), 'reply fixture missing'
          assert any(m.get('photo') for m in messages), 'photo fixture missing'
          assert any(m.get('media_type') == 'sticker' for m in messages), 'sticker fixture missing'
          print('TELEGRAM_DUMMY_FIXTURE_OK')
          PY
          node --check app/src/main/assets/web/app.js
          bash tools/verify-rclone-aar.sh app/libs/gomobile.aar
          grep -q 'AskPassword", false' app/src/main/java/com/tarjs/archive/RcloneEngine.kt
          grep -q 'rpcChecked("config/listremotes", JSONObject())' app/src/main/java/com/tarjs/archive/RcloneEngine.kt
          grep -q 'RcloneConfigParser.isEncrypted' app/src/main/java/com/tarjs/archive/MainActivity.kt
          grep -q 'rcloneConfigNeedsPassword' app/src/main/java/com/tarjs/archive/MainActivity.kt

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false

      - name: Test actual rclone v1.75.1 encrypted-config architecture with dummies
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/rclone-tarjs-test
          git clone --depth 1 --branch v1.75.1 https://github.com/rclone/rclone.git /tmp/rclone-tarjs-test
          cp ci/rclone_architecture_harness.go /tmp/rclone-tarjs-test/tarjs_architecture_harness.go
          cd /tmp/rclone-tarjs-test
          go run ./tarjs_architecture_harness.go

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Run JVM regression tests
        working-directory: source/TAR-JS
        run: gradle --stacktrace --no-daemon testDebugUnitTest

      - name: Build debug APK
        working-directory: source/TAR-JS
        run: gradle --stacktrace --no-daemon assembleDebug

      - name: Verify APK embeds the exact gomobile native runtime
        shell: bash
        run: |
          set -euo pipefail
          APK=source/TAR-JS/app/build/outputs/apk/debug/app-debug.apk
          AAR=source/TAR-JS/app/libs/gomobile.aar
          test -s "$APK"
          unzip -Z1 "$APK" | grep -qx 'lib/arm64-v8a/libgojni.so'
          unzip -p "$AAR" jni/arm64-v8a/libgojni.so | sha256sum > /tmp/aar.sha
          unzip -p "$APK" lib/arm64-v8a/libgojni.so | sha256sum > /tmp/apk.sha
          cmp /tmp/aar.sha /tmp/apk.sha
          sha256sum "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: TAR-JS-rclone-architecture-fixed-debug
          path: source/TAR-JS/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
