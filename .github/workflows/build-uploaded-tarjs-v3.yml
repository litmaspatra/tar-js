name: Build Uploaded TAR-JS Debug APK v3

on:
  push:
    branches: [ build-uploaded-gomobile-fixed ]
    paths:
      - '.github/workflows/build-uploaded-tarjs-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout uploaded-source branch
        uses: actions/checkout@v4

      - name: Reconstruct exact uploaded source
        shell: bash
        run: |
          cat \
            ci/gfix_00.b64 \
            ci/gfix_01.b64 \
            ci/gfix_02.b64 \
            ci/gfix_03.b64 \
            ci/gfix_04.b64 \
            ci/gfix_05.b64 \
            ci/gfix_06.b64 \
            ci/gfix_07.b64 \
            ci/gfix_08.b64 \
            ci/gfix_09.b64 \
            ci/gfix_10.b64 \
            ci/gfix_11.b64 \
            ci/gfix_12.b64 \
            ci/gfix_13.b64 \
            ci/gfix_14.b64 \
            ci/gfix_15.b64 \
            > /tmp/tarjs-upload.b64
          test "$(wc -c < /tmp/tarjs-upload.b64)" -eq 143496
          base64 --decode /tmp/tarjs-upload.b64 > /tmp/tarjs-upload-lite.zip
          echo "2f6dfd10339e3becb5e542a5a0b005cfb4d7c7fd1d8f0dff8ed5d840e041aba4  /tmp/tarjs-upload-lite.zip" | sha256sum -c -
          rm -rf tarjs-upload
          mkdir tarjs-upload
          unzip -q /tmp/tarjs-upload-lite.zip -d tarjs-upload

      - name: Normalize extracted file permissions
        shell: bash
        run: |
          cd tarjs-upload
          chmod -R u+rwX .
          echo "PERMISSIONS_NORMALIZED"

      - name: Resilient source readability scan
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('tarjs-upload')
          skipped = []
          checked = 0

          for path in root.rglob('*'):
              if not path.is_file():
                  continue
              try:
                  with path.open('rb') as f:
                      f.read(1)
                  checked += 1
              except (PermissionError, OSError) as exc:
                  skipped.append((path, exc))
                  print(f"SKIP_UNREADABLE: {path}: {exc}")

          print(f"READABLE_FILES_CHECKED={checked}")
          print(f"UNREADABLE_FILES_SKIPPED={len(skipped)}")
          PY

      - name: Verify required source files
        shell: bash
        run: |
          required=(
            tarjs-upload/settings.gradle.kts
            tarjs-upload/app/build.gradle.kts
            tarjs-upload/tools/verify-rclone-aar.sh
            tarjs-upload/app/src/main/assets/web/vendor/lottie.min.js
          )
          for f in "${required[@]}"; do
            if [ ! -r "$f" ]; then
              echo "REQUIRED_FILE_UNREADABLE_OR_MISSING: $f"
              exit 1
            fi
          done
          echo "SOURCE_INTEGRITY_OK"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare Android SDK
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Go 1.26.6
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache: false

      - name: Build rclone gomobile AAR
        shell: bash
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-}"
          if [ -z "$ANDROID_NDK_HOME" ] || [ ! -d "$ANDROID_NDK_HOME" ]; then
            ANDROID_NDK_HOME="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          fi
          export ANDROID_NDK_HOME ANDROID_NDK="$ANDROID_NDK_HOME"
          test -d "$ANDROID_NDK_HOME"
          git clone --depth 1 --branch v1.75.1 https://github.com/rclone/rclone.git /tmp/rclone
          cd /tmp/rclone
          go install golang.org/x/mobile/cmd/gobind@latest
          go install golang.org/x/mobile/cmd/gomobile@latest
          export PATH="$PATH:$HOME/go/bin"
          gomobile init
          gomobile bind -androidapi 26 -target=android/arm64 -javapkg=org.rclone \
            -ldflags "-s -X github.com/rclone/rclone/fs.Version=v1.75.1" \
            -o "$GITHUB_WORKSPACE/tarjs-upload/app/libs/gomobile.aar" \
            github.com/rclone/rclone/librclone/gomobile
          cd "$GITHUB_WORKSPACE/tarjs-upload"
          bash tools/verify-rclone-aar.sh app/libs/gomobile.aar

      - name: Verify frontend syntax
        run: node --check tarjs-upload/app/src/main/assets/web/app.js

      - name: Assemble debug APK
        working-directory: tarjs-upload
        run: gradle --stacktrace --no-daemon assembleDebug

      - name: Verify debug APK
        shell: bash
        run: |
          APK=tarjs-upload/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libgojni.so'
          sha256sum "$APK"
          ls -lh "$APK"
          echo "APK_OK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TAR-JS-gomobile-fixed-debug
          path: tarjs-upload/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
