name: Export current TAR-JS source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-tarjs-current-source.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct authoritative source
        shell: bash
        run: |
          set -euo pipefail
          cat ci/tarjs_authoritative_20260927_00.b64 ci/tarjs_authoritative_20260927_01.b64 ci/tarjs_authoritative_20260927_02.b64 ci/tarjs_authoritative_20260927_03.b64 ci/tarjs_authoritative_20260927_04.b64 ci/tarjs_authoritative_20260927_05.b64 > /tmp/tarjs.zip.b64
          base64 --decode /tmp/tarjs.zip.b64 > /tmp/TAR-JS-source.zip
          mkdir source
          unzip -q /tmp/TAR-JS-source.zip -d source
          chmod -R u+rwX source
      - name: Apply current production patches
        shell: bash
        working-directory: source/TAR-JS
        run: |
          set -euo pipefail
          base64 --decode "$GITHUB_WORKSPACE/ci/tarjs_prd_v1.patch.gz.b64" | gunzip > /tmp/tarjs_prd_v1.patch
          patch -p2 < /tmp/tarjs_prd_v1.patch
          cd "$GITHUB_WORKSPACE"
          python3 ci/patch_single_chat_and_chat_photo.py
          python3 ci/patch_robolectric_importer_qa.py
          python3 ci/patch_background_indexing.py
          python3 ci/apply_framework_notification_fix.py
          python3 ci/apply_kotlin23_compat.py
      - name: Export text source
        uses: actions/upload-artifact@v4
        with:
          name: TAR-JS-current-patched-source
          path: |
            source/TAR-JS/app/build.gradle.kts
            source/TAR-JS/app/src/main/AndroidManifest.xml
            source/TAR-JS/app/src/main/java/com/tarjs/archive/*.kt
            source/TAR-JS/app/src/main/assets/web/app.js
            source/TAR-JS/app/src/main/assets/web/styles.css
          retention-days: 2
