name: TAR-JS verified debug APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['.hermes-build/**']
permissions:
  contents: read
  actions: read
jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Verify native Kotlin Compose architecture
        shell: bash
        run: |
          test -f app/src/main/java/com/tarjs/app/MainActivity.kt
          ! find app/src/main -type f \( -name '*.java' -o -name '*.js' -o -name '*.html' \) | grep .
          ! grep -R 'WebView\|android.webkit\|loadUrl' app/src/main || true
          grep -R 'androidx.compose\|material3' app/build.gradle.kts
          grep -R 'lottie-compose' app/build.gradle.kts
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Lint
        run: gradle --no-daemon lintDebug
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Verify APK is native and from this commit
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'classes.dex'
          ! unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E 'assets/web|\.html|\.js'
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee apk.sha256
          echo "commit=${GITHUB_SHA}" | tee build-provenance.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TAR-JS-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk.sha256
            build-provenance.txt
          if-no-files-found: error
          retention-days: 30
