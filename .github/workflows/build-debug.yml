name: TAR-JS Phase 2 strict gates

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-rclone:
    name: Build native app and real rclone gomobile input
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK and NDK
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools' 'ndk;27.2.12479018'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Build rclone gomobile AAR from pinned upstream source
        shell: bash
        run: |
          git clone --depth 1 --branch v1.75.1 https://github.com/rclone/rclone.git "$RUNNER_TEMP/rclone"
          cp ci/rclone_reset_android.go "$RUNNER_TEMP/rclone/librclone/gomobile/reset_android.go"
          cp ci/rclone_reset_test.go "$RUNNER_TEMP/rclone/librclone/gomobile/reset_android_test.go"
          cd "$RUNNER_TEMP/rclone"
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          "$HOME/go/bin/gomobile" init
          go test ./librclone/gomobile -run TestRcloneResetEncryptedConfig -count=1
          "$HOME/go/bin/gomobile" bind -androidapi 26 -target=android/arm64 -javapkg=org.rclone -o gomobile.aar github.com/rclone/rclone/librclone/gomobile
          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          cp gomobile.aar "$GITHUB_WORKSPACE/app/libs/gomobile.aar"
      - name: Verify AAR contents
        shell: bash
        run: |
          unzip -l app/libs/gomobile.aar | grep -q 'classes.jar'
          unzip -p app/libs/gomobile.aar classes.jar > "$RUNNER_TEMP/classes.jar"
          jar tf "$RUNNER_TEMP/classes.jar" | grep -q '^org/rclone/gomobile/Gomobile.class$'
          unzip -l app/libs/gomobile.aar | grep -q 'jni/arm64-v8a/libgojni.so'
      - name: Unit tests and lint
        run: gradle --no-daemon testDebugUnitTest lintDebug
      - name: Debug APK
        run: gradle --no-daemon assembleDebug
      - name: Verify APK provenance
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q classes.dex
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee apk.sha256
          echo "commit=${GITHUB_SHA}" | tee build-provenance.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TAR-JS-phase2-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/libs/gomobile.aar
            apk.sha256
            build-provenance.txt
          if-no-files-found: error

  phase2-crypt-b2:
    name: Strict encrypted rclone B2 credential gate
    needs: build-and-rclone
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache: false
      - name: Require real B2 integration credentials (not available in dummy CI)
        shell: bash
        env:
          B2_ACCOUNT_ID: ${{ secrets.B2_ACCOUNT_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: |
          test -n "$B2_ACCOUNT_ID" || { echo 'Missing required secret B2_ACCOUNT_ID'; exit 1; }
          test -n "$B2_APPLICATION_KEY" || { echo 'Missing required secret B2_APPLICATION_KEY'; exit 1; }
          test -n "$B2_BUCKET" || { echo 'Missing required secret B2_BUCKET'; exit 1; }
      - name: Run real B2 through encrypted crypt remote (credential-gated)
        shell: bash
        env:
          B2_ACCOUNT_ID: ${{ secrets.B2_ACCOUNT_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: |
          go install github.com/rclone/rclone@v1.75.1
          export PATH="$HOME/go/bin:$PATH"
          p1=$(rclone obscure 'tar-js-phase2-password')
          p2=$(rclone obscure 'tar-js-phase2-salt')
          cat > "$RUNNER_TEMP/rclone.conf" <<EOF
          [b2]
          type = b2
          account = $B2_ACCOUNT_ID
          key = $B2_APPLICATION_KEY
          [crypt]
          type = crypt
          remote = b2:$B2_BUCKET/tar-js-phase2
          password = $p1
          password2 = $p2
          filename_encryption = standard
          directory_name_encryption = true
          EOF
          printf '{"phase":"2","source":"strict-gate"}\n' > "$RUNNER_TEMP/result.json"
          rclone --config "$RUNNER_TEMP/rclone.conf" copyto "$RUNNER_TEMP/result.json" crypt:result.json
          rclone --config "$RUNNER_TEMP/rclone.conf" cat crypt:result.json | cmp - "$RUNNER_TEMP/result.json"
          rclone --config "$RUNNER_TEMP/rclone.conf" deletefile crypt:result.json

  phase2-local-contract:
    name: Deterministic local B2/crypt/rclone contract gate
    needs: build-and-rclone
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache: false
      - name: Run local object-store double through crypt
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/rclone/rclone@v1.75.1
          export PATH="$HOME/go/bin:$PATH"
          root="$RUNNER_TEMP/local-object-store"
          mkdir -p "$root"
          p1=$(rclone obscure 'tar-js-dummy-password')
          p2=$(rclone obscure 'tar-js-dummy-salt')
          cat > "$RUNNER_TEMP/local-rclone.conf" <<EOF
          [dummyb2]
          type = local
          remote = $root
          [b2crypt]
          type = crypt
          remote = dummyb2:telegram
          password = $p1
          password2 = $p2
          filename_encryption = standard
          directory_name_encryption = true
          EOF
          test "$(rclone --config "$RUNNER_TEMP/local-rclone.conf" listremotes)" = $'dummyb2:\nb2crypt:'
          rclone --config "$RUNNER_TEMP/local-rclone.conf" copyto fixtures/local-remote/telegram/exports/2026/result.json b2crypt:exports/2026/result.json
          rclone --config "$RUNNER_TEMP/local-rclone.conf" copyto fixtures/local-remote/telegram/exports/2026/media/photo.txt b2crypt:exports/2026/media/photo.txt
          rclone --config "$RUNNER_TEMP/local-rclone.conf" lsf --recursive b2crypt:exports/2026 | grep -Fx 'result.json'
          rclone --config "$RUNNER_TEMP/local-rclone.conf" lsf --recursive b2crypt:exports/2026/media | grep -Fx 'photo.txt'
          rclone --config "$RUNNER_TEMP/local-rclone.conf" cat b2crypt:/exports/2026/result.json > "$RUNNER_TEMP/result.json"
          cmp fixtures/local-remote/telegram/exports/2026/result.json "$RUNNER_TEMP/result.json"
          rclone --config "$RUNNER_TEMP/local-rclone.conf" deletefile b2crypt:exports/2026/result.json
          ! rclone --config "$RUNNER_TEMP/local-rclone.conf" cat b2crypt:exports/2026/result.json >/dev/null 2>&1
          echo 'LOCAL_CONTRACT=PASS (local filesystem object-store double; not real B2)'

  phase2-fixture-matrix:
    name: Deterministic Phase 2 fixture matrix
    needs: build-and-rclone
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate archive and media fixture matrix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip, json
          from pathlib import Path
          root = Path('fixtures/phase2-matrix')
          account = json.loads((root / 'full-account-result.json').read_text())
          single = json.loads((root / 'single-chat-result.json').read_text())
          chats = account['chats']['list']
          assert len(chats) == 2
          assert sum(len(c['messages']) for c in chats) == 8
          assert single['id'] == 1002 and len(single['messages']) == 2
          kinds = {p.name for p in (root / 'media').iterdir()}
          assert {'static.webp','video.mp4','audio.mp3','voice.ogg','file.bin','animated.tgs','sticker.webm'} <= kinds
          assert gzip.decompress((root / 'media' / 'animated.tgs').read_bytes()).startswith(b'{')
          assert (root / 'plain-rclone.conf').read_bytes().startswith(bytes.fromhex('efbbbf'))
          print('FIXTURE_MATRIX=PASS chats=2 messages=8 media=7 rich/reply/forward/edited/service covered')
          PY
      - name: Run deterministic local crypt contract using committed fixture
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/rclone/rclone@v1.75.1
          export PATH="$HOME/go/bin:$PATH"
          root="$RUNNER_TEMP/fixture-object-store"
          mkdir -p "$root"
          p1=$(rclone obscure 'tar-js-dummy-password')
          p2=$(rclone obscure 'tar-js-dummy-salt')
          sed "s#remote = /tmp/tar-js-dummy-b2#remote = $root#; s#password = obscured-dummy-password#password = $p1#; s#password2 = obscured-dummy-salt#password2 = $p2#" fixtures/phase2-matrix/encrypted-rclone.conf.fixture > "$RUNNER_TEMP/rclone.conf"
          rclone --config "$RUNNER_TEMP/rclone.conf" copyto fixtures/phase2-matrix/full-account-result.json b2crypt:telegram/full-account-result.json
          rclone --config "$RUNNER_TEMP/rclone.conf" copyto fixtures/phase2-matrix/single-chat-result.json b2crypt:telegram/single-chat-result.json
          test "$(rclone --config "$RUNNER_TEMP/rclone.conf" lsf --recursive b2crypt:telegram | wc -l)" -eq 2
          echo 'FIXTURE_CRYPT=PASS (local backend double; not real B2)'

  phase2-saf:
    name: SAF compile and instrumentation gate
    needs: build-and-rclone
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;35.0.0' 'platform-tools' 'emulator' 'system-images;android-34;google_apis;x86_64'
          echo "ANDROID_SERIAL=emulator-5554" >> "$GITHUB_ENV"
      - name: Restore real gomobile AAR
        uses: actions/download-artifact@v4
        with:
          name: TAR-JS-phase2-${{ github.sha }}
          path: phase2-artifact
      - name: Install AAR input
        run: mkdir -p app/libs && find phase2-artifact -name gomobile.aar -type f -exec cp {} app/libs/gomobile.aar \; && test -s app/libs/gomobile.aar
      - name: Compile and run bounded SAF instrumentation tests on software emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: true
          cores: 1
          ram-size: 1536M
          disk-size: 2048M
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -no-snapshot-save -gpu off -accel off
          emulator-boot-timeout: 1200
          disable-animations: true
          script: |
            # android-emulator-runner executes this block with /usr/bin/sh.
            # Keep the bounded boot/test gates POSIX-compatible.
            set -eu
            adb wait-for-device
            timeout 180s sh -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\\r")" = "1" ]; do sleep 2; done'
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            timeout 12m gradle --no-daemon testDebugUnitTest connectedDebugAndroidTest
