name: Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"
          cache: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Install Android build tools
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"
      - name: Build pinned rclone Android library
        shell: bash
        run: |
          git clone --depth 1 --branch v1.75.1 https://github.com/rclone/rclone.git "$RUNNER_TEMP/rclone"
          cp ci/rclone_reset_android.go "$RUNNER_TEMP/rclone/librclone/gomobile/reset_android.go"
          cp ci/rclone_reset_test.go "$RUNNER_TEMP/rclone/librclone/gomobile/reset_android_test.go"
          cd "$RUNNER_TEMP/rclone"
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          "$HOME/go/bin/gomobile" init
          go test ./librclone/gomobile -run TestRcloneResetEncryptedConfig -count=1
          "$HOME/go/bin/gomobile" bind \
            -androidapi 26 \
            -target=android/arm64 \
            -ldflags="-s -w" \
            -javapkg=org.rclone \
            -o gomobile.aar \
            github.com/rclone/rclone/librclone/gomobile
          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          cp gomobile.aar "$GITHUB_WORKSPACE/app/libs/gomobile.aar"
      - name: Test and lint
        run: gradle --no-daemon testDebugUnitTest lintDebug
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TAR-JS-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
