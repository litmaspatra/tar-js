name: Build TAR-JS EOF fix debug APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-tarjs-eof-fix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct authoritative uploaded source
        shell: bash
        run: |
          set -euo pipefail
          cat ci/tarjs_authoritative_20260927_00.b64 \
              ci/tarjs_authoritative_20260927_01.b64 \
              ci/tarjs_authoritative_20260927_02.b64 \
              ci/tarjs_authoritative_20260927_03.b64 \
              ci/tarjs_authoritative_20260927_04.b64 \
              ci/tarjs_authoritative_20260927_05.b64 \
              > /tmp/tarjs.zip.b64
          test "$(wc -c < /tmp/tarjs.zip.b64)" -eq 33303364
          base64 --decode /tmp/tarjs.zip.b64 > /tmp/TAR-JS-source-gomobile-fixed.zip
          echo 'ee9bf544762357f7e152e0c25a4539627b6967d336c1a40f2d322724632f2dca  /tmp/TAR-JS-source-gomobile-fixed.zip' | sha256sum -c -
          unzip -tq /tmp/TAR-JS-source-gomobile-fixed.zip
          mkdir source
          unzip -q /tmp/TAR-JS-source-gomobile-fixed.zip -d source
          chmod -R u+rwX source
          cd source
          sha256sum -c "$GITHUB_WORKSPACE/ci/tarjs_authoritative_20260927.sha256"

      - name: Apply targeted rclone EOF panic fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('source/TAR-JS')

          engine = root / 'app/src/main/java/com/tarjs/archive/RcloneEngine.kt'
          text = engine.read_text(encoding='utf-8')
          old = '''        if (!initialized) {
            gomobileClass.getMethod("rcloneInitialize").invoke(null)
            initialized = true
        }
        rpcChecked("config/setpath", JSONObject().put("path", configFile.absolutePath))
'''
          new = '''        if (!initialized) {
            gomobileClass.getMethod("rcloneInitialize").invoke(null)
            initialized = true
        }
        // Librclone is headless inside Android. Never let it prompt on stdin for
        // an encrypted config password: that path terminates with a fatal EOF.
        rpcChecked("options/set", JSONObject().put("main", JSONObject().put("AskPassword", false)))
        rpcChecked("config/setpath", JSONObject().put("path", configFile.absolutePath))
'''
          if old not in text:
              raise SystemExit('RcloneEngine initialize block did not match authoritative source')
          engine.write_text(text.replace(old, new, 1), encoding='utf-8')

          main = root / 'app/src/main/java/com/tarjs/archive/MainActivity.kt'
          text = main.read_text(encoding='utf-8')
          old = '''        if (rclone.available() && rcloneConfigFile != null) { try { rclone.initialize(rcloneConfigFile!!) } catch (_: Exception) {} }
'''
          new = '''        if (rclone.available() && rcloneConfigFile != null) {
            // A saved encrypted config cannot be opened headlessly until the user
            // supplies its password. Avoid triggering rclone's stdin password path.
            val encryptedConfig = runCatching {
                rcloneConfigFile!!.bufferedReader().use { reader ->
                    reader.readLine().orEmpty().trimStart().startsWith("RCLONE_ENCRYPT_V0:")
                }
            }.getOrDefault(false)
            if (!encryptedConfig) {
                try { rclone.initialize(rcloneConfigFile!!) } catch (_: Exception) {}
            }
        }
'''
          if old not in text:
              raise SystemExit('MainActivity startup rclone block did not match authoritative source')
          main.write_text(text.replace(old, new, 1), encoding='utf-8')

          assert 'JSONObject().put("AskPassword", false)' in engine.read_text(encoding='utf-8')
          assert 'if (!encryptedConfig)' in main.read_text(encoding='utf-8')
          print('RCLONE_HEADLESS_EOF_FIX_APPLIED')
          PY

      - name: Apply Kotlin 2.3 compatibility fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('source/TAR-JS/app/build.gradle.kts')
          source = path.read_text(encoding='utf-8')
          old = '    kotlinOptions { jvmTarget = "17" }\n'
          if old not in source:
              raise SystemExit('Expected Kotlin jvmTarget configuration was not found')
          source = source.replace(old, '', 1)
          marker = '\n\ndependencies {'
          replacement = '''

          kotlin {
              compilerOptions {
                  jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
              }
          }

          dependencies {'''
          if marker not in source:
              raise SystemExit('Expected dependencies block marker was not found')
          path.write_text(source.replace(marker, replacement, 1), encoding='utf-8')
          PY

      - name: Smoke checks
        shell: bash
        working-directory: source/TAR-JS
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          fixture=json.loads(Path('fixtures/result.json').read_text(encoding='utf-8'))
          chats=fixture.get('chats',{}).get('list',[])
          assert chats and chats[0].get('messages')
          print('DUMMY_JSON_OK')
          PY
          node --check app/src/main/assets/web/app.js
          bash tools/verify-rclone-aar.sh app/libs/gomobile.aar
          grep -q 'AskPassword", false' app/src/main/java/com/tarjs/archive/RcloneEngine.kt
          grep -q 'if (!encryptedConfig)' app/src/main/java/com/tarjs/archive/MainActivity.kt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Run JVM tests
        working-directory: source/TAR-JS
        run: gradle --stacktrace --no-daemon testDebugUnitTest

      - name: Build debug APK
        working-directory: source/TAR-JS
        run: gradle --stacktrace --no-daemon assembleDebug

      - name: Verify final APK
        shell: bash
        run: |
          set -euo pipefail
          APK=source/TAR-JS/app/build/outputs/apk/debug/app-debug.apk
          AAR=source/TAR-JS/app/libs/gomobile.aar
          test -s "$APK"
          unzip -Z1 "$APK" | grep -qx 'lib/arm64-v8a/libgojni.so'
          unzip -p "$AAR" jni/arm64-v8a/libgojni.so | sha256sum > /tmp/aar.sha
          unzip -p "$APK" lib/arm64-v8a/libgojni.so | sha256sum > /tmp/apk.sha
          cmp /tmp/aar.sha /tmp/apk.sha
          sha256sum "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: TAR-JS-eof-fixed-debug
          path: source/TAR-JS/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
